name: terragrunt apply

on:
  pull_request: # TODO: `pull_request_target`を検証する
    branches:
      - develop
    types:
      - labeled
    paths:
      - "environments/**"
      - "modules/**"
      - "terraform/**"

jobs:
  check-pr-approved:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'applied') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      repository-projects: read
    outputs:
      is_pr_approved: ${{ steps.check-pr-approved.outputs.is_pr_approved }}
    steps:
      - name: Create GitHub App token
        id: create_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf #v2.2.1
        with:
          app-id: ${{ secrets.GH_APP_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            learning-terraform

      - name: Check PR is approved
        id: check-pr-approved
        run: |
          set -ex
          is_pr_approved=$(gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews | jq -r '.[].state' | grep -q "APPROVED" && echo "true" || echo "false")
          echo "is_pr_approved=$is_pr_approved" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check result
        run: echo "${{ steps.check-pr-approved.outputs.is_pr_approved }}"

      - name: Remove label
        if: ${{ steps.check-pr-approved.outputs.is_pr_approved == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{github.event.pull_request.number}} --remove-label applied
          gh pr comment ${{github.event.pull_request.number}} --body 'this PR was not approved, so `applied` label was removed.'
          exit 1

  terragrunt-apply:
    needs: check-pr-approved
    if: |
      ${{ contains(github.event.pull_request.labels.*.name, 'applied') }}
        && needs.check-pr-approved.outputs.is_pr_approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write # NOTE: OIDCプロバイダーでの認証に必須
      pull-requests: write
      repository-projects: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Download plan files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 #v7.0.0
        with:
          name: ${{ github.event.pull_request.number }}.tfplan

      - name: debug
        run: |
          ls -al

          cd environments/common
          ls -al ap-northeast-1/github-actions-role
          ls -al ap-northeast-1/github-actions-role/.terragrunt-cache 


